name: SBOM & Build Provenance

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # necessário para SLSA provenance (OIDC)
  attestations: write

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sbom:
    name: Generate SBOM & provenance
    runs-on: ubuntu-latest
    outputs:
      sbom-path: ${{ steps.sbom.outputs.sbom-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: v24

      - name: Install dependencies
        run: npm ci

      - name: Generate CycloneDX SBOM
        id: sbom
        run: |
          npm install -g @cyclonedx/bom@latest
          cyclonedx-npm -o sbom.cyclonedx.json
          echo "sbom-path=sbom.cyclonedx.json" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 90

  provenance:
    name: SLSA provenance attestation
    needs: sbom
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Generate SLSA provenance
        uses: slsa-framework/slsa-github-generator/github/workflow/generator_builtin_slsa@v3
        with:
          base64-subjects: "${{ needs.sbom.outputs.sbom-path }}"
