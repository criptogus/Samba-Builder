name: SBOM & Build Provenance

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # necessário para SLSA provenance (OIDC)
  attestations: write

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sbom:
    name: Generate SBOM & provenance
    runs-on: ubuntu-latest
    outputs:
      sbom-path: ${{ steps.sbom.outputs.sbom-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: v24

      - name: Install dependencies
        run: npm ci

      - name: Generate CycloneDX SBOM
        id: sbom
        run: |
          npm install -g @cyclonedx/bom@latest
          cyclonedx-npm -o sbom.cyclonedx.json
          echo "sbom-path=sbom.cyclonedx.json" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@a8a3f3ad30e3422c9c7b887a1114c5687247cf95 # v4
        with:
          name: sbom
          path: sbom.cyclonedx.json
          retention-days: 90

  provenance:
    name: SLSA provenance attestation
    needs: sbom
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Generate SLSA provenance
        uses: slsa-framework/slsa-github-generator/github/workflow/generator_builtin_slsa@v3
        with:
          base64-subjects: "${{ needs.sbom.outputs.sbom-path }}"
