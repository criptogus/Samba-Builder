# .github/workflows/release.yml

# Need to write to repo contents to upload the app to GitHub Release
# See: https://www.electronforge.io/config/publishers/github#authentication
permissions:
  contents: read

name: Release app
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar a release ao final (desmarque para deixar como rascunho e revisar antes)"
        type: boolean
        default: true

concurrency:
  group: release-app-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare Release Tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      version: ${{ steps.prepare.outputs.version }}
      release-state: ${{ steps.prepare.outputs.release_state }}
    steps:
      - name: Github checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: v24.13.1
          package-manager-cache: false # Do NOT use GitHub Actions cache in release builds: https://adnanthekhan.com/2024/12/21/cacheract-the-monster-in-your-build-cache/
      - name: Create or update unpublished release tag
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/prepare-release-tag.js prepare

  build:
    needs: prepare-release
    environment: release
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      # Continue building other platforms even if one fails
      fail-fast: false
      matrix:
        os:
          - { name: "windows", image: "windows-2022" }
          # See https://github.com/samba-sh/samba/issues/96
          - { name: "linux", image: "ubuntu-22.04" }
          - { name: "macos-intel", image: "macos-15-intel" }
          - { name: "macos", image: "macos-latest" }
    runs-on: ${{ matrix.os.image }}
    steps:
      - name: Github checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: v24.13.1
          package-manager-cache: false # Do NOT use GitHub Actions cache in release builds: https://adnanthekhan.com/2024/12/21/cacheract-the-monster-in-your-build-cache/
      - name: Install npm 11.8.0
        run: npm install -g npm@11.8.0
      - run: npm ci
        env:
          # Required for @vscode/ripgrep to download binaries without hitting GitHub API rate limits
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Use clang 18 for Linux native rebuilds
        if: matrix.os.name == 'linux'
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          wget -qO /tmp/llvm-snapshot.gpg.key https://apt.llvm.org/llvm-snapshot.gpg.key
          gpg --dearmor /tmp/llvm-snapshot.gpg.key
          sudo install -m 0644 /tmp/llvm-snapshot.gpg.key.gpg /etc/apt/keyrings/apt.llvm.org.gpg
          echo "deb [signed-by=/etc/apt/keyrings/apt.llvm.org.gpg] https://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" | sudo tee /etc/apt/sources.list.d/llvm-toolchain-jammy-18.list
          # Preserve the runner's package indexes and avoid refreshing unrelated Ubuntu mirrors.
          sudo apt-get update \
            -o Dir::Etc::sourcelist="sources.list.d/llvm-toolchain-jammy-18.list" \
            -o Dir::Etc::sourceparts="-" \
            -o APT::Get::List-Cleanup="0"
          sudo apt-get install -y clang-18
          echo "CC=clang-18" >> "$GITHUB_ENV"
          echo "CXX=clang++-18" >> "$GITHUB_ENV"
      - name: Detect signing credentials
        id: signing
        shell: bash
        env:
          PRESENT_APPLE_CERT: ${{ secrets.MACOS_CERT_P12 }}
          PRESENT_AZURE_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$PRESENT_APPLE_CERT" ]; then echo "apple=true" >> "$GITHUB_OUTPUT"; else echo "apple=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "$PRESENT_AZURE_CLIENT" ]; then echo "azure=true" >> "$GITHUB_OUTPUT"; else echo "azure=false" >> "$GITHUB_OUTPUT"; fi

      - name: add macos cert
        if: contains(matrix.os.name, 'macos') && steps.signing.outputs.apple == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: chmod +x tools/add-macos-cert.sh && . ./tools/add-macos-cert.sh
      # Windows only
      - name: Install Azure Trusted Signing
        if: contains(matrix.os.name, 'windows') && steps.signing.outputs.azure == 'true'
        shell: powershell
        run: |
          # Install via NuGet instead of winget (winget is slow/unreliable in CI)
          $installDir = "$env:RUNNER_TEMP\TrustedSigning"
          nuget install Microsoft.Trusted.Signing.Client -Version 1.0.95 -OutputDirectory $installDir -Source https://api.nuget.org/v3/index.json

          $dllPath = Get-ChildItem -Path $installDir -Recurse -Filter "Azure.CodeSigning.Dlib.dll" |
            Where-Object { $_.FullName -match "x64" } |
            Select-Object -First 1 -ExpandProperty FullName

          if ($dllPath) {
            Write-Host "Found DLL at: $dllPath"
            "AZURE_CODE_SIGNING_DLIB=$dllPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Error "Could not find Azure.CodeSigning.Dlib.dll"
            exit 1
          }

      - name: Find Windows 11 SDK SignTool
        if: contains(matrix.os.name, 'windows') && steps.signing.outputs.azure == 'true'
        shell: powershell
        run: |
          $sdkPath = "C:\Program Files (x86)\Windows Kits\10\bin"
          $signTool = Get-ChildItem -Path $sdkPath -Recurse -Filter "signtool.exe" |
            Where-Object { $_.FullName -match "\\x64\\" } |
            Sort-Object { [version]($_.FullName -replace '.*\\(\d+\.\d+\.\d+\.\d+)\\.*', '$1') } -Descending |
            Select-Object -First 1

          if ($signTool) {
            Write-Host "Found SignTool at: $($signTool.FullName)"
            "SIGNTOOL_PATH=$($signTool.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          } else {
            Write-Error "Could not find x64 signtool.exe"
            exit 1
          }

      - name: Create Azure signing metadata
        if: contains(matrix.os.name, 'windows') && steps.signing.outputs.azure == 'true'
        shell: pwsh
        run: |
          @'
          {
            "Endpoint": "https://eus.codesigning.azure.net/",
            "CodeSigningAccountName": "samba",
            "CertificateProfileName": "samba-tech"
          }
          '@ | Out-File -Encoding utf8 signing-metadata.json

          echo "AZURE_METADATA_JSON=$PWD\signing-metadata.json" >> $env:GITHUB_ENV

      # Build (dry-run) - does NOT publish
      - name: Build app (dry-run)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: npm run publish -- --dry-run
        env:
          DEBUG: "@electron/*,electron-forge:*,electron-osx-sign*,electron-notarize*,electron-windows-installer:main,electron-windows-sign"
          NODE_OPTIONS: "--max-old-space-size=4096"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          WINDOWS_SIGN: ${{ steps.signing.outputs.azure == 'true' && 'true' || '' }}
          SKIP_CODE_SIGNING: ${{ steps.signing.outputs.apple != 'true' && 'true' || '' }}

      - name: Generate release provenance manifest
        env:
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: node scripts/generate-release-provenance.js "out/release-provenance-${{ matrix.os.name }}.json" "${{ matrix.os.name }}" out/make

      - name: Attest release provenance manifest
        # Attestations nao existem para repositorio privado de conta pessoal
        # ("Feature not available for user-owned private repositories"): em repo
        # publico o passo roda, em privado e pulado em vez de derrubar o build.
        if: github.event.repository.private == false
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: out/release-provenance-${{ matrix.os.name }}.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-${{ matrix.os.name }}
          path: out/
          retention-days: 1

  publish:
    name: Publish Release
    needs: [prepare-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Github checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Use Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: v24.13.1
          package-manager-cache: false # Do NOT use GitHub Actions cache in release builds: https://adnanthekhan.com/2024/12/21/cacheract-the-monster-in-your-build-cache/
      - name: Install npm 11.8.0
        run: npm install -g npm@11.8.0
      - run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all build artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: out/
          pattern: build-*
          merge-multiple: true

      - name: List artifacts
        run: ls -laR out/

      - name: Publish from dry-run
        run: ./node_modules/.bin/electron-forge publish --from-dry-run
        env:
          DEBUG: "@electron/*,electron-forge:*"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload provenance manifests to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" out/release-provenance-*.json --clobber
      - name: Verify release tag still points to this workflow commit
        run: node scripts/prepare-release-tag.js verify
      - name: Verify all release assets are uploaded
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-release-assets.js
      # A release nasce como rascunho no preparo. Publicar aqui, depois da
      # verificacao de proveniencia, mantem o guard de releases nao autorizadas
      # satisfeito: o autor continua sendo github-actions[bot].
      - name: Publish release
        if: inputs.publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # RELEASE_TAG e definido por passo neste job (nao no nivel do job):
          # sem isto o gh procura uma release sem nome e falha com
          # "release not found", que parece problema de tag e nao de variavel.
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          if [ -z "$RELEASE_TAG" ]; then
            echo "RELEASE_TAG vazio: o job de preparo nao devolveu a tag."
            exit 1
          fi
          # Notas a partir dos commits: o app mostra "o que ha de novo" lendo o
          # corpo da release, e o rascunho do preparo nasce sem corpo — sem isto
          # a tela aparece em branco.
          NOTES="$(gh api -X POST "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$RELEASE_TAG" --jq .body)"
          if [ -n "$NOTES" ]; then
            gh release edit "$RELEASE_TAG" --notes "$NOTES"
          fi
          gh release edit "$RELEASE_TAG" --draft=false
